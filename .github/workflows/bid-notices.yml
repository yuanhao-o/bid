name: 招标公告抓取

# 北京时间（GitHub 用 UTC，比北京慢 8 小时）：08:10 / 12:10 / 15:10 / 16:10
# 15:10 那次保证「下午 17:00 之前」网页上已经有当天公告；
# 16:10 那次再补一遍 15:10–16:10 新发的，供 17:00 的云函数读取入库并推送。
on:
  schedule:
    - cron: '10 0,4,7,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bid-notices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取公开公告（22 个湖北来源）
        run: node scripts/fetch-notices.js
        env:
          WINDOW_DAYS: '62'
          CITY_PAGES: '3'      # 每个地市子站抓 3 页（约 15 天）；首次回补时调大
          MAX_DETAIL: '40'

      - name: 生成站点数据与增量文件
        run: node scripts/build-data.js
        env:
          # 与云端 bid_subscriptions.keywords 保持一致，改关键词时两边都改
          PUSH_KEYWORDS: '装饰,装修,维修,改造,改扩建,EPC,总承包'

      - name: 提交数据文件
        run: |
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git add data/notices.json data/delta.json
          if git diff --cached --quiet; then
            echo "本轮无变化"
            exit 0
          fi
          git commit --allow-empty-message -m ""
          git push
